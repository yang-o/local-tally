name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build macOS app
        run: python scripts/build.py mac

      - name: Zip macOS app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Tally.app Tally-macOS.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tally-macOS
          path: dist/Tally-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build Windows app
        run: python scripts/build.py win

      - name: Zip Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Tally/* -DestinationPath dist/Tally-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tally-Windows
          path: dist/Tally-Windows.zip
